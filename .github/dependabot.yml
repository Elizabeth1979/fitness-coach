# Monthly dependency updates, grouped so they arrive as at most two PRs.
# Every PR gets a Vercel preview build, which runs lint, the tests and the
# type-checked build (vercel.json), so a breaking update shows up red.
# Security fixes come separately, as soon as an advisory is published, once
# "Dependabot security updates" is on in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
