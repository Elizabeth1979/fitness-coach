# Monthly dependency updates. Minor/patch updates are grouped into two PRs
# (production, development); each major version arrives as its own PR so it
# can be reviewed and tested on its own. Every PR gets a Vercel preview build,
# which runs lint, the tests and the type-checked build (vercel.json), so a
# breaking update shows up red before anyone merges it.
# Security fixes come separately, as soon as an advisory is published, once
# "Dependabot security updates" is on in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Must match the Node version Vercel builds with (project setting: 24.x).
      # Bump it by hand when that changes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
